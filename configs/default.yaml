# ASSUMPTION: Default configuration parameters for MUS-Net reproduction
dataset:
  patch_size: 64
  num_folds: 5
  seed: 42
  raw_min: -1000.0
  raw_max: 400.0
  lung_window_level: -600.0
  lung_window_width: 1500.0
  mediastinal_window_level: 40.0
  mediastinal_window_width: 400.0
  data_directory: "data/lidc_preprocessed"
  # Nodule selection (UGS-Net protocol by the same authors: 3-30 mm, >= 2 readers).
  # Matches paper Table 1 subset (9,727 slices).
  min_annotators: 2
  min_diameter_mm: 3.0
  max_diameter_mm: 30.0

model:
  base_channels: 32
  latent_dimension: 6
  beta: 1.0
  attention_downsample_ratio: 1
  otsu_bins: 256
  otsu_straight_through: true
  gabor_frequencies: [0.25]
  gabor_orientations: [0.0, 0.78539816339, 1.57079632679, 2.35619449019]

loss:
  alpha_1: 1.0
  alpha_2: 0.5
  use_dice_loss: true
  dice_weight: 1.0
  bce_weight: 1.0
  use_posterior_kl: false
  kl_weight: 0.001

train:
  optimizer: "adam"
  batch_size: 16
  learning_rate: 0.0002
  momentum: 0.9
  epochs: 200
  enable_amp: false
  checkpoint_directory: "checkpoints"
  log_directory: "logs"

evaluation:
  normalized_surface_distance_tau: 2.0
  export_visualizations: true
  visualization_directory: "visualizations"

ablation:
  active_branches: ["lung", "medias", "raw"]
  lung_filter: "sobel"
  medias_filter: "otsu"
  raw_filter: "gabor"
  use_uncertainty_indication_module: true
  use_feature_filter_module: true
